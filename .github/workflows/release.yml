name: Release macOS DMG

on:
  push:
    branches: [master]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile

      - name: Verify version and release configuration
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          test "$(node -p "require('./package.json').version")" = "$version"
          test "$(node -p "require('./apps/desktop/package.json').version")" = "$version"
          test "$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")" = "$version"
          grep -Fqx "version = \"$version\"" Cargo.toml
          if git rev-parse "refs/tags/v${version}" >/dev/null 2>&1; then
            if ! draft="$(gh release view "v${version}" --json isDraft --jq .isDraft 2>/dev/null)" || test "$draft" != true; then
              echo "Tag v${version} already belongs to a published release; refusing to overwrite it." >&2
              exit 1
            fi
          fi

          require_secret_group() {
            local label="$1"
            shift
            local missing=()
            local name
            for name in "$@"; do
              test -n "${!name}" || missing+=("$name")
            done
            if test "${#missing[@]}" -ne 0; then
              echo "${label} is required for macOS releases; missing secrets: ${missing[*]}" >&2
              exit 1
            fi
          }

          validate_optional_secret_group() {
            local label="$1"
            shift
            local configured=0
            local name
            for name in "$@"; do
              test -z "${!name}" || configured=$((configured + 1))
            done
            if test "$configured" -ne 0 && test "$configured" -ne "$#"; then
              echo "${label} is only partially configured; set all of these secrets or none of them: $*" >&2
              exit 1
            fi
            test "$configured" -eq "$#"
          }

          apple_signing=false
          validate_optional_secret_group "Apple signing and notarization" APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID && apple_signing=true
          require_secret_group "Tauri updater signing" TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD TAURI_UPDATER_PUBLIC_KEY

          if test "$apple_signing" = true; then
            signing_mode=developer-id
          else
            signing_mode=adhoc
          fi
          echo "apple_signing=${apple_signing}" >> "$GITHUB_OUTPUT"
          echo "signing_mode=${signing_mode}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Configure updater artifacts
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = "apps/desktop/src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.bundle.createUpdaterArtifacts = true;
          config.plugins.updater.pubkey = process.env.TAURI_UPDATER_PUBLIC_KEY;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Export Apple signing environment
        if: steps.version.outputs.apple_signing == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            delimiter="release-secret-$(uuidgen)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "${!name}" "$delimiter" >> "$GITHUB_ENV"
          done

      - name: Configure ad-hoc signing
        if: steps.version.outputs.apple_signing != 'true'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Export updater signing environment
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            delimiter="release-secret-$(uuidgen)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "${!name}" "$delimiter" >> "$GITHUB_ENV"
          done

      - name: Build and stage signed DMG
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Agent Pipeline v__VERSION__
          releaseBody: Download the Apple Silicon DMG below and drag Agent Pipeline into Applications. Development releases are ad-hoc signed, so macOS may require Open Anyway on first launch.
          generateReleaseNotes: true
          releaseDraft: true
          args: --target aarch64-apple-darwin

      - name: Verify bundled release
        env:
          SIGNING_MODE: ${{ steps.version.outputs.signing_mode }}
        shell: bash
        run: |
          app_path="target/aarch64-apple-darwin/release/bundle/macos/Agent Pipeline.app"
          dmg_path="$(find target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          scripts/verify-macos-release.sh "$app_path" "$dmg_path" "$SIGNING_MODE"

      - name: Publish verified release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release edit "v${VERSION}" --draft=false
